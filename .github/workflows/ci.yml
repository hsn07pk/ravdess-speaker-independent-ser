name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, unit tests and analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Recompute the summary tables from the saved predictions
        run: python -m ser.analysis > /dev/null

  report:
    name: Build the report
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: report
      - uses: actions/upload-artifact@v7
        with:
          name: report
          path: report/main.pdf
